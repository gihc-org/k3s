# Deployment beskriver hvordan Kubernetes skal køre og vedligeholde vores applikation
apiVersion: apps/v1      # API-versionen der bruges til Deployments
kind: Deployment         # Ressourcetypen
metadata:
  name: nginx            # Navnet på denne Deployment

spec:
  replicas: 1            # Antal kopier (Pods) der skal køre samtidigt
  selector:
    matchLabels:
      app: nginx         # Deployment'en styrer Pods med dette label

  template:              # Skabelon for de Pods som Deployment'en opretter
    metadata:
      labels:
        app: nginx       # Label der sættes på hver Pod — matcher selector ovenfor
    spec:
      containers:
        - name: nginx            # Navn på containeren inde i Pod'en
          image: nginx:alpine    # Docker-image der bruges (lille Alpine-variant)
          ports:
            - containerPort: 80  # Den port nginx lytter på inde i containeren

---

# Service eksponerer Deployment'en så den kan nås via netværket
apiVersion: v1
kind: Service
metadata:
  name: nginx            # Navnet på denne Service

spec:
  type: NodePort         # Eksponerer servicen på en fast port på selve noden (Raspberry Pi'en)
  selector:
    app: nginx           # Sender trafik videre til Pods med dette label

  ports:
    - port: 80           # Port som Service'en lytter på internt i clusteret
      targetPort: 80     # Port på Pod'en som trafikken sendes videre til
      nodePort: 30080    # Ekstern port på noden — tilgængelig udefra på http://<ip>:30080
