# Deployment beskriver hvordan Kubernetes skal køre og vedligeholde vores applikation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: webapps     # Ressourcen oprettes i webapps namespace i stedet for default

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: db-password

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html

      volumes:
        - name: html
          configMap:
            name: nginx-config

---

apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: webapps     # Ressourcen oprettes i webapps namespace i stedet for default

spec:
  type: NodePort
  selector:
    app: nginx

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
