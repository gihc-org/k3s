apiVersion: v1
kind: Secret
metadata:
  name: app-secret             # Navnet bruges til at referere til Secret'en fra andre ressourcer
type: Opaque                   # Opaque = generisk secret (modsat f.eks. kubernetes.io/tls til certifikater)
stringData:
  db-password: "hemmeligtpassword"  # stringData accepterer klartekst — Kubernetes base64-koder det automatisk
